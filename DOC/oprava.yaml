PROJECT:
  name: "FootballAnalysisEngine"
  repository: "CowleyCZE/FootballAnalysisEngine"
  primary_branch_for_repairs: "fix/part-11-integration"

  IMPORTANT:
    - "NEUPRAVOVAT main jako výchozí větev pro opravy."
    - "feature/p0-orchestrator-research-fixes-* je historická/stale větev."
    - "Opravy provádět postupně podle FÁZE 1 až FÁZE 6."
    - "Po každé fázi musí projít definované testy."
    - "Nepovažovat unit testy za důkaz funkčního systému."
    - "Finální kritérium je plný autonomní end-to-end běh."

  CORE_PRINCIPLE:
    evidence_first: true
    no_fabricated_data: true
    cutoff_is_mandatory: true
    ai_is_not_source_of_truth: true
    success_only_when_pipeline_is_functionally_complete: true


============================================================
PRIORITY MODEL
============================================================

P0:
  meaning: "Blokuje finální verzi systému."
  rule: "Dokud existuje P0, systém není READY."

P1:
  meaning: "Nutné pro spolehlivý produkční provoz."
  rule: "Po odstranění P0 musí být odstraněny všechny P1."

P2:
  meaning: "Předprodukční dotažení."
  rule: "P2 řešit až po stabilním P0 + P1."


