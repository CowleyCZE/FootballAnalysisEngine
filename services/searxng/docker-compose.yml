# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    environment:
      # Keep bind-mounted settings owned by the notebook user so setup can
      # safely update them on every run. The YAML itself contains no secret.
      FORCE_OWNERSHIP: "false"
    volumes:
      # The network helper may generate a private runtime-config directory with
      # a non-placeholder SearXNG secret.  The tracked core-config remains a
      # safe template and is used when no local configuration exists.
      - ${SEARXNG_CONFIG_DIR:-./core-config}/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
