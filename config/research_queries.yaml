MATCH_IDENTITY:
  discovery:
    - "{home_team} vs {away_team} {competition} {match_date}"
    - "{home_team} {away_team} fixture date venue"
  verification:
    - "{home_team} vs {away_team} official match details"

FORM_HOME:
  discovery:
    - "{home_team} recent results match history"
    - "{home_team} last 5 matches results"
  verification:
    - "{home_team} recent form statistics"

FORM_AWAY:
  discovery:
    - "{away_team} recent results match history"
    - "{away_team} last 5 matches results"
  verification:
    - "{away_team} recent form statistics"

STATISTICS:
  discovery:
    - "{home_team} {away_team} statistics {competition}"
    - "{home_team} {away_team} xG shots possession"
  verification:
    - "{home_team} {away_team} match statistics"

HEAD_TO_HEAD:
  discovery:
    - "{home_team} {away_team} head to head"
    - "{home_team} vs {away_team} previous meetings"

ABSENCES_HOME:
  discovery:
    - "{home_team} injuries"
    - "{home_team} injury news"
    - "{home_team} unavailable players"
  verification:
    - "{home_team} team news {away_team}"
    - "{home_team} injury update {match_date}"
  primary:
    - "{home_team} official injury update"

ABSENCES_AWAY:
  discovery:
    - "{away_team} injuries"
    - "{away_team} injury news"
    - "{away_team} unavailable players"
  verification:
    - "{away_team} team news {home_team}"
    - "{away_team} injury update {match_date}"
  primary:
    - "{away_team} official injury update"

EXPECTED_LINEUPS:
  discovery:
    - "{home_team} {away_team} predicted lineups"
    - "{home_team} {away_team} expected lineup"

WEATHER:
  discovery:
    - "weather forecast {venue} {match_date}"
    - "weather {home_team} stadium {match_date}"
